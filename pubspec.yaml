name: sewadal_hajari_app
description: "Weekly Satsang Attendance (Hajari) app - Gents & Ladies, local DB, PDF/Excel export."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Local database
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # Export
  pdf: ^3.10.1
  printing: ^5.11.1
  excel: ^4.0.6

  # Share files (PDF/Excel) to other apps
  share_plus: ^9.0.0

  # Dates
  intl: ^0.19.0

  # CSV import/export of member master list
  csv: ^6.0.0
  file_picker: ^8.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

# ---------------------------------------------------------------------------
# flutter_launcher_icons config - generates app icons for Android/iOS from
# a single source image. Run with: flutter pub run flutter_launcher_icons
# This must be a TOP-LEVEL key (column 0), NOT nested under dev_dependencies.
# ---------------------------------------------------------------------------
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1A3C6E"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
